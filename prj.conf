# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE0=y
CONFIG_SERIAL=y

CONFIG_GPIO=y

# Make sure printk is printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HHS_10001"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Custom HHS GATT service (NUS 미사용)
# BT_NUS_SECURITY_ENABLED는 프로젝트 Kconfig 심볼(BT_SMP 선택 여부)
CONFIG_BT_NUS_SECURITY_ENABLED=n

# Enable bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# This example requires more stack
CONFIG_MAIN_STACK_SIZE=1152
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y
CONFIG_BT_ASSERT=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_BT_NUS_UART_BUFFER_SIZE=128
# UART RX 유휴 타임아웃(us): 패킷 수신 후 지연 없이 이벤트 발생하도록 짧게
CONFIG_BT_NUS_UART_RX_WAIT_TIME=1000

CONFIG_FPU=y

# MTU/데이터 길이 키우기(상대도 지원해야 실제로 커짐)
# 컨트롤러(netcore) 쪽 DLE는 sysbuild/ipc_radio.conf에서 설정
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# GATT cache invalidation
CONFIG_BT_GATT_SERVICE_CHANGED=y

# 256 pkt/s 스트리밍: 짧은 연결 간격 선호값(7.5~15ms) 요청
# (수락 여부는 central 몫 — Android는 대체로 수락, iOS는 15ms 수준)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# notify TX 경로 큐 증설: connection event당 8개 이상 전송 가능해야
# 256 pkt/s(30ms 간격 기준 ~8개/event)를 유실 없이 소화
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10

